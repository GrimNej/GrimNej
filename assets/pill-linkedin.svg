@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes twinkle { 0%, 100% { opacity: var(--o, 0.6); } 50% { opacity: calc(var(--o, 0.6) * 0.25); } }
.fade { animation: fadein 1.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
