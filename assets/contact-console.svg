<svg width="1100" height="260" viewBox="0 0 1100 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Contact console</title>
  <desc id="desc">Humorous contact panel for reaching GrimNej.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1100" y2="260">
      <stop stop-color="#111827"/>
      <stop offset=".55" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#701A75"/>
    </linearGradient>
    <style>
      @keyframes pop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.025)} }
      @keyframes cursor { 0%,45%{opacity:0} 46%,100%{opacity:1} }
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .pop{transform-origin:center;animation:pop 3s ease-in-out infinite}
      .cursor{animation:cursor 1s step-end infinite}
    </style>
  </defs>
  <rect width="1100" height="260" rx="28" fill="url(#g)"/>
  <rect x="38" y="38" width="1024" height="184" rx="22" fill="#020617" opacity=".78" stroke="#FFFFFF" stroke-opacity=".26"/>
  <text x="76" y="84" fill="#99F6E4" class="mono" font-size="20">idea_to_mvp --speed=ridiculous --excuses=0</text>
  <text x="76" y="132" fill="#FFFFFF" class="sans pop" font-size="32" font-weight="800">Have an AI idea? I can tell if it flies.</text>
  <text x="76" y="172" fill="#FFFFFF" class="sans pop" font-size="32" font-weight="800">Then I build the runway.</text>
  <text x="76" y="208" fill="#CBD5E1" class="mono" font-size="18">contact: grim98413@gmail.com <tspan class="cursor">_</tspan></text>
</svg>
