<svg width="1100" height="340" viewBox="0 0 1100 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Current AI focus map</title>
  <desc id="desc">A visual map of GrimNej's current focus areas: AI agents, agentic AI, automation, MVPs, cloud deployment, and non-stop adapting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="340">
      <stop stop-color="#06111F"/>
      <stop offset=".55" stop-color="#111827"/>
      <stop offset="1" stop-color="#2B0B3F"/>
    </linearGradient>
    <linearGradient id="stroke" x1="180" y1="70" x2="930" y2="270">
      <stop stop-color="#00F5FF"/>
      <stop offset=".55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes orbit { from{stroke-dashoffset:0} to{stroke-dashoffset:-160} }
      @keyframes breathe { 0%,100%{transform:scale(1);opacity:.92} 50%{transform:scale(1.035);opacity:1} }
      @keyframes blink { 0%,100%{opacity:.5} 50%{opacity:1} }
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .orbit{stroke-dasharray:18 18;animation:orbit 7s linear infinite}
      .node{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
      .node:nth-of-type(2){animation-delay:.3s}
      .node:nth-of-type(3){animation-delay:.6s}
      .node:nth-of-type(4){animation-delay:.9s}
      .node:nth-of-type(5){animation-delay:1.2s}
      .node:nth-of-type(6){animation-delay:1.5s}
      .blink{animation:blink 1.4s ease-in-out infinite}
    </style>
  </defs>
  <rect width="1100" height="340" rx="28" fill="url(#bg)"/>
  <path class="orbit" d="M302 92C430 22 668 22 798 92C934 165 912 246 774 282C640 318 458 318 326 282C190 244 170 166 302 92Z" stroke="url(#stroke)" stroke-width="4" opacity=".75"/>
  <g filter="url(#glow)">
    <circle cx="550" cy="170" r="62" fill="#020617" stroke="#00F5FF" stroke-width="3"/>
    <text x="550" y="160" fill="#FFFFFF" class="sans" font-size="24" font-weight="800" text-anchor="middle">AI</text>
    <text x="550" y="188" fill="#A7F3D0" class="mono" font-size="14" text-anchor="middle">non-stop</text>
    <text x="550" y="208" fill="#FFD166" class="mono" font-size="14" text-anchor="middle">adapting</text>
  </g>
  <g class="node">
    <rect x="120" y="72" width="210" height="70" rx="18" fill="#101827" stroke="#00F5FF"/>
    <text x="225" y="104" fill="#FFFFFF" class="sans" font-size="20" font-weight="800" text-anchor="middle">AI agents</text>
    <text x="225" y="126" fill="#94A3B8" class="mono" font-size="13" text-anchor="middle">tools, memory, loops</text>
  </g>
  <g class="node">
    <rect x="770" y="72" width="210" height="70" rx="18" fill="#101827" stroke="#F472B6"/>
    <text x="875" y="104" fill="#FFFFFF" class="sans" font-size="20" font-weight="800" text-anchor="middle">Agentic AI</text>
    <text x="875" y="126" fill="#94A3B8" class="mono" font-size="13" text-anchor="middle">orchestrated systems</text>
  </g>
  <g class="node">
    <rect x="94" y="210" width="230" height="70" rx="18" fill="#101827" stroke="#A78BFA"/>
    <text x="209" y="242" fill="#FFFFFF" class="sans" font-size="20" font-weight="800" text-anchor="middle">Automation</text>
    <text x="209" y="264" fill="#94A3B8" class="mono" font-size="13" text-anchor="middle">workflows with less drama</text>
  </g>
  <g class="node">
    <rect x="430" y="250" width="240" height="70" rx="18" fill="#101827" stroke="#FFD166"/>
    <text x="550" y="282" fill="#FFFFFF" class="sans" font-size="20" font-weight="800" text-anchor="middle">Rapid MVPs</text>
    <text x="550" y="304" fill="#94A3B8" class="mono" font-size="13" text-anchor="middle">prototype before overthinking</text>
  </g>
  <g class="node">
    <rect x="780" y="210" width="230" height="70" rx="18" fill="#101827" stroke="#34D399"/>
    <text x="895" y="242" fill="#FFFFFF" class="sans" font-size="20" font-weight="800" text-anchor="middle">Cloud deploy</text>
    <text x="895" y="264" fill="#94A3B8" class="mono" font-size="13" text-anchor="middle">Docker, APIs, infra</text>
  </g>
  <text x="550" y="40" fill="#E5E7EB" class="sans" font-size="22" font-weight="800" text-anchor="middle">Currently focused on anything that makes AI useful</text>
</svg>
