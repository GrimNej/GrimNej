<svg width="1100" height="300" viewBox="0 0 1100 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Idea to MVP operating style</title>
  <desc id="desc">Animated visual diagram showing an idea moving through mapping, risk testing, stack choice, prototype, and handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="300">
      <stop stop-color="#070B14"/>
      <stop offset=".5" stop-color="#111827"/>
      <stop offset="1" stop-color="#15102C"/>
    </linearGradient>
    <linearGradient id="flow" x1="92" y1="150" x2="1008" y2="150">
      <stop stop-color="#00F5FF"/>
      <stop offset=".35" stop-color="#A78BFA"/>
      <stop offset=".68" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes dash { to{stroke-dashoffset:-120} }
      @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.045)} }
      @keyframes spark { 0%{offset-distance:0%;opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{offset-distance:100%;opacity:0} }
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .dash{stroke-dasharray:16 16;animation:dash 5s linear infinite}
      .card{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}
      .spark{offset-path:path('M110 150 C260 84 360 216 510 150 S760 84 990 150');animation:spark 5.5s ease-in-out infinite}
    </style>
  </defs>
  <rect width="1100" height="300" rx="28" fill="url(#bg)"/>
  <text x="550" y="42" fill="#FFFFFF" class="sans" font-size="25" font-weight="850" text-anchor="middle">How I move from idea to working product</text>
  <path class="dash" d="M110 150C260 84 360 216 510 150S760 84 990 150" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" opacity=".86"/>
  <circle class="spark" r="9" fill="#FFFFFF" filter="url(#glow)"/>
  <g class="card">
    <rect x="54" y="92" width="160" height="116" rx="20" fill="#0F172A" stroke="#00F5FF"/>
    <text x="134" y="132" fill="#FFFFFF" class="sans" font-size="19" font-weight="800" text-anchor="middle">Idea</text>
    <text x="134" y="162" fill="#94A3B8" class="mono" font-size="13" text-anchor="middle">what if...</text>
    <text x="134" y="184" fill="#FDE68A" class="mono" font-size="13" text-anchor="middle">famous last words</text>
  </g>
  <g class="card">
    <rect x="262" y="92" width="160" height="116" rx="20" fill="#0F172A" stroke="#A78BFA"/>
    <text x="342" y="132" fill="#FFFFFF" class="sans" font-size="19" font-weight="800" text-anchor="middle">Map</text>
    <text x="342" y="162" fill="#94A3B8" class="mono" font-size="13" text-anchor="middle">system shape</text>
    <text x="342" y="184" fill="#C4B5FD" class="mono" font-size="13" text-anchor="middle">no fog allowed</text>
  </g>
  <g class="card">
    <rect x="470" y="92" width="160" height="116" rx="20" fill="#0F172A" stroke="#F472B6"/>
    <text x="550" y="132" fill="#FFFFFF" class="sans" font-size="19" font-weight="800" text-anchor="middle">Test Risk</text>
    <text x="550" y="162" fill="#94A3B8" class="mono" font-size="13" text-anchor="middle">hardest part first</text>
    <text x="550" y="184" fill="#FBCFE8" class="mono" font-size="13" text-anchor="middle">panic, but typed</text>
  </g>
  <g class="card">
    <rect x="678" y="92" width="160" height="116" rx="20" fill="#0F172A" stroke="#34D399"/>
    <text x="758" y="132" fill="#FFFFFF" class="sans" font-size="19" font-weight="800" text-anchor="middle">Build</text>
    <text x="758" y="162" fill="#94A3B8" class="mono" font-size="13" text-anchor="middle">MVP + deploy</text>
    <text x="758" y="184" fill="#BBF7D0" class="mono" font-size="13" text-anchor="middle">it lives</text>
  </g>
  <g class="card">
    <rect x="886" y="92" width="160" height="116" rx="20" fill="#0F172A" stroke="#FFD166"/>
    <text x="966" y="132" fill="#FFFFFF" class="sans" font-size="19" font-weight="800" text-anchor="middle">Handoff</text>
    <text x="966" y="162" fill="#94A3B8" class="mono" font-size="13" text-anchor="middle">docs + next moves</text>
    <text x="966" y="184" fill="#FDE68A" class="mono" font-size="13" text-anchor="middle">future-proof-ish</text>
  </g>
  <text x="550" y="258" fill="#CBD5E1" class="mono" font-size="16" text-anchor="middle">Architecture first. Execution fast. No shrine to one stack.</text>
</svg>
